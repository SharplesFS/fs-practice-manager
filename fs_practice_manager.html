// Which IRIS step number = complete (AP and PT use their final step; others use highest seen)
const COMPLETE_STEPS = {
  AP: 11, PT: 8, CT: 7,
  ST: 5, PAT: 5, AR: 2, P11D: 4, EMI: 2,
}

// Parse status string → step number (reads IRIS "07. Accounts Finalised [date user]" format)
function parseStatus(statusStr) {
  if (!statusStr || statusStr === "PENDING") return 0;
  const m = statusStr.match(/^(\d+)\./);
  if (m) return parseInt(m[1]);
  return 0;
}

// Extract the date stamp from an IRIS status string e.g. "[28/01/2026 JS]"
function parseStatusDate(statusStr) {
  if (!statusStr) return null;
  const m = statusStr.match(/\[(\d{2}\/\d{2}\/\d{4})\s/);
  return m ? m[1] : null;
}

// Extract the user initials from an IRIS status string
function parseStatusUser(statusStr) {
  if (!statusStr) return null;
  const m = statusStr.match(/\[\d{2}\/\d{2}\/\d{4}\s+(\S+)\]/);
  return m ? m[1] : null;
}


function parseDate(str) {
  if (!str) return null;
  const parts = str.split("/");
  if (parts.length !== 3) return null;
  return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
}

function formatDate(str) {
  if (!str) return "—";
  return str;
}

const TODAY = new Date();
TODAY.setHours(0, 0, 0, 0);

function daysUntil(dateStr) {
  const d = parseDate(dateStr);
  if (!d) return null;
  return Math.round((d - TODAY) / (1000 * 60 * 60 * 24));
}

function deadlineClass(days) {
  if (days === null) return "";
  if (days < 0) return "overdue";
  if (days <= 30) return "urgent";
  if (days <= 60) return "warning";
  return "ok";
}

function isComplete(job) {
  const type = job["Job Type"];
  const completeStep = COMPLETE_STEPS[type];
  if (completeStep === undefined) return false;
  return parseStatus(job.Status) >= completeStep;
}

function getStepLabel(job) {
  const wf = WORKFLOW[job["Job Type"]];
  if (!wf) return job.Status || "Pending";
  const step = parseStatus(job.Status);
  const found = wf.find(s => s.step === step);
  const label = found ? found.label : (job.Status || "Pending");
  const user = parseStatusUser(job.Status);
  const date = parseStatusDate(job.Status);
  if (user && date && step > 0) return label + " — " + date + " " + user;
  return label;
}

// Just the stage label without date/user (for compact displays)
function getStepLabelShort(job) {
  const wf = WORKFLOW[job["Job Type"]];
  if (!wf) return job.Status || "Pending";
  const step = parseStatus(job.Status);
  const found = wf.find(s => s.step === step);
  return found ? found.label : (job.Status || "Pending");
}

                        const isLast = idx === wf.length - 1;
                        return (
                          <div key={stage.step} style={{ display: "flex", alignItems: "stretch", flex: "1 1 90px", minWidth: 80 }}>
                            <button onClick={() => setSelectedStep(isSelected ? null : stage.step)}
                              style={{ flex: 1, background: isSelected ? color : stage.complete ? "#f0fdf4" : cnt > 0 ? color + "12" : "#f8fafc",
                                border: "2px solid " + (isSelected ? color : stage.complete ? "#bbf7d0" : cnt > 0 ? color + "50" : "#e2e8f0"),
                                borderRadius: 8, padding: "10px 8px", cursor: "pointer", textAlign: "center", transition: "all 0.15s" }}>
                              <div style={{ fontSize: 20, fontWeight: 700, color: isSelected ? "white" : stage.complete ? "#059669" : cnt > 0 ? color : "#cbd5e1" }}>
                                {cnt}
                              </div>
                              <div style={{ fontSize: 10, color: isSelected ? "rgba(255,255,255,0.85)" : "#64748b", marginTop: 4, lineHeight: 1.3 }}>
                                {stage.label}
                              </div>
                            </button>
                            {!isLast && (
                              <div style={{ display: "flex", alignItems: "center", color: "#cbd5e1", fontSize: 16, padding: "0 2px" }}>›</div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Jobs at selected step */}
                  {selectedStep !== null && (
                    <div style={{ background: "white", border: "1px solid " + color + "40", borderRadius: 10, overflow: "hidden" }}>
                      <div style={{ background: color + "0f", borderBottom: "1px solid " + color + "30", padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <span style={{ fontWeight: 600, fontSize: 14, color }}>
                          {wf.find(s => s.step === selectedStep)?.label} — {jobsAtStep.length} jobs
                        </span>
                        <button onClick={() => setSelectedStep(null)} style={{ background: "none", border: "none", color: "#94a3b8", cursor: "pointer", fontSize: 18 }}>×</button>
                      </div>
                      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                        <thead>
                          <tr style={{ background: "#f8fafc", borderBottom: "1px solid #e2e8f0" }}>
                            <th style={{ padding: "8px 14px", textAlign: "left", fontWeight: 600, fontSize: 11, color: "#64748b" }}>Client</th>
                            <th style={{ padding: "8px 14px", textAlign: "left", fontWeight: 600, fontSize: 11, color: "#64748b" }}>Year End</th>
                            <th style={{ padding: "8px 14px", textAlign: "left", fontWeight: 600, fontSize: 11, color: "#64748b" }}>Deadline</th>
                            <th style={{ padding: "8px 14px", textAlign: "left", fontWeight: 600, fontSize: 11, color: "#64748b" }}>Partner</th>
                            <th style={{ padding: "8px 14px", textAlign: "left", fontWeight: 600, fontSize: 11, color: "#64748b" }}>Stage Updated</th>
                            <th style={{ padding: "8px 14px", textAlign: "left", fontWeight: 600, fontSize: 11, color: "#64748b" }}>Allocated To</th>
                            <th style={{ padding: "8px 14px", textAlign: "left", fontWeight: 600, fontSize: 11, color: "#64748b" }}>Notes</th>
                          </tr>
                        </thead>
                        <tbody>
                          {jobsAtStep.sort((a, b) => (parseDate(a["Stat. D/Line"]) || new Date(9999,0)) - (parseDate(b["Stat. D/Line"]) || new Date(9999,0))).map((j, i) => {
                            const days = daysUntil(j["Stat. D/Line"]);
                            const dc = deadlineClass(days);
                            const statusDate = parseStatusDate(j.Status);
                            const statusUser = parseStatusUser(j.Status);
                            return (
                              <tr key={i} style={{ borderBottom: "1px solid #f1f5f9", background: i % 2 === 0 ? "white" : "#fafafa" }}>
                                <td style={{ padding: "9px 14px" }}>
                                  <div style={{ fontWeight: 500 }}>{j.Name}</div>
                                  <div style={{ fontSize: 11, color: "#94a3b8" }}>{j.Client}</div>
                                </td>
                                <td style={{ padding: "9px 14px", color: "#475569", fontSize: 12 }}>{formatDate(j["P/E Date"])}</td>
                                <td style={{ padding: "9px 14px", fontSize: 12 }}>
                                  <span style={{ color: dc === "overdue" ? "#dc2626" : dc === "urgent" ? "#f97316" : "#475569", fontWeight: dc === "overdue" || dc === "urgent" ? 600 : 400 }}>
                                    {formatDate(j["Stat. D/Line"])}
                                    {days !== null && <span style={{ marginLeft: 6, fontSize: 11, color: dc === "overdue" ? "#dc2626" : "#94a3b8" }}>
                                      {days < 0 ? `(${Math.abs(days)}d over)` : `(${days}d)`}
                                    </span>}
                                  </span>
                                </td>
                                <td style={{ padding: "9px 14px", color: "#475569", fontSize: 12 }}>{j["Job Partner"] || "—"}</td>
                                <td style={{ padding: "9px 14px", fontSize: 12, color: "#64748b" }}>
                                  {statusDate ? <span>{statusDate} <span style={{ color: "#94a3b8" }}>{statusUser}</span></span> : <span style={{ color: "#cbd5e1" }}>—</span>}
                                </td>
                                <td style={{ padding: "6px 10px", minWidth: 130 }}>
                                  {(() => {
                                    const key = noteKey(j);
                                    const isEditingA = editingAlloc === key;
                                    const existing = allocations[key] || "";
                                    if (isEditingA) return (
                                      <input autoFocus value={editingAllocVal}
                                        onChange={e => setEditingAllocVal(e.target.value)}
                                        onBlur={() => { saveAlloc(key, editingAllocVal); setEditingAlloc(null); }}
                                        onKeyDown={e => { if (e.key === "Enter" || e.key === "Escape") { if (e.key === "Enter") saveAlloc(key, editingAllocVal); setEditingAlloc(null); } }}
                                        style={{ width: "100%", fontSize: 12, border: "1px solid #2563eb", borderRadius: 5, padding: "4px 8px", outline: "none", fontFamily: "inherit" }}
                                      />
                                    );
                                    return (
                                      <div onClick={() => { setEditingAlloc(key); setEditingAllocVal(existing); }}
                                        style={{ minHeight: 26, cursor: "text", fontSize: 12, padding: "3px 6px", borderRadius: 5, border: "1px solid transparent", transition: "border 0.1s",
                                          color: existing ? "#1e293b" : "#cbd5e1", fontStyle: existing ? "normal" : "italic" }}
                                        onMouseEnter={e => e.currentTarget.style.borderColor = "#e2e8f0"}
                                        onMouseLeave={e => e.currentTarget.style.borderColor = "transparent"}>
                                        {existing || "Assign…"}
                                        {existing && <span onClick={e => { e.stopPropagation(); saveAlloc(key, ""); }} style={{ marginLeft: 6, color: "#94a3b8", fontSize: 11, cursor: "pointer" }}>✕</span>}
                                      </div>
                                    );
                                  })()}
                                </td>
                                <td style={{ padding: "6px 10px", minWidth: 150 }}>
                                  {(() => {
                                    const nk = noteKey(j);
                                    const isEditingN = editingNote === nk;
                                    const existingN = notes[nk] || "";
                                    if (isEditingN) return (
                                      <textarea autoFocus value={editingVal}
                                        onChange={e => setEditingVal(e.target.value)}
                                        onBlur={() => { saveNote(nk, editingVal); setEditingNote(null); }}
                                        onKeyDown={e => { if (e.key === "Escape") setEditingNote(null); if (e.key === "Enter" && !e.shiftKey) { saveNote(nk, editingVal); setEditingNote(null); e.preventDefault(); } }}
                                        style={{ width: "100%", fontSize: 12, border: "1px solid #2563eb", borderRadius: 5, padding: "4px 8px", outline: "none", fontFamily: "inherit", minHeight: 54, resize: "vertical" }}
                                      />
                                    );
                                    return (
                                      <div onClick={() => { setEditingNote(nk); setEditingVal(existingN); }}
                                        style={{ minHeight: 26, cursor: "text", fontSize: 12, padding: "3px 6px", borderRadius: 5, border: "1px solid transparent", transition: "border 0.1s",
                                          color: existingN ? "#1e293b" : "#cbd5e1", fontStyle: existingN ? "normal" : "italic", whiteSpace: "pre-wrap", maxWidth: 200 }}
                                        onMouseEnter={e => e.currentTarget.style.borderColor = "#e2e8f0"}
                                        onMouseLeave={e => e.currentTarget.style.borderColor = "transparent"}>
                                        {existingN || "Add note…"}
                                        {existingN && <span onClick={e => { e.stopPropagation(); saveNote(nk, ""); }} style={{ marginLeft: 6, color: "#94a3b8", fontSize: 11, cursor: "pointer" }}>✕</span>}
                                      </div>
                                    );
                                  })()}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}

                  {/* All jobs for this type if no step selected */}
                  {selectedStep === null && (
                    <div style={{ background: "white", border: "1px solid #e2e8f0", borderRadius: 10, overflow: "hidden" }}>
                      <div style={{ padding: "12px 16px", borderBottom: "1px solid #e2e8f0", fontSize: 12, color: "#64748b" }}>
                        All {jobs.length} {JOB_LABELS[type]} jobs — click a stage above to filter
                      </div>
                      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                        <thead>
                          <tr style={{ background: "#f8fafc", borderBottom: "1px solid #e2e8f0" }}>
                            <th style={{ padding: "8px 14px", textAlign: "left", fontWeight: 600, fontSize: 11, color: "#64748b" }}>Client</th>
                            <th style={{ padding: "8px 14px", textAlign: "left", fontWeight: 600, fontSize: 11, color: "#64748b" }}>Year End</th>
                            <th style={{ padding: "8px 14px", textAlign: "left", fontWeight: 600, fontSize: 11, color: "#64748b" }}>Deadline</th>
                            <th style={{ padding: "8px 14px", textAlign: "left", fontWeight: 600, fontSize: 11, color: "#64748b" }}>Partner</th>
                            <th style={{ padding: "8px 14px", textAlign: "left", fontWeight: 600, fontSize: 11, color: "#64748b" }}>Current Stage</th>
                            <th style={{ padding: "8px 14px", textAlign: "left", fontWeight: 600, fontSize: 11, color: "#64748b" }}>Allocated To</th>
                            <th style={{ padding: "8px 14px", textAlign: "left", fontWeight: 600, fontSize: 11, color: "#64748b" }}>Notes</th>
                          </tr>
                        </thead>
                        <tbody>
                          {jobs.sort((a, b) => (parseDate(a["Stat. D/Line"]) || new Date(9999,0)) - (parseDate(b["Stat. D/Line"]) || new Date(9999,0))).map((j, i) => {
                            const days = daysUntil(j["Stat. D/Line"]);
                            const dc = deadlineClass(days);
                            const step = parseStatus(j.Status);
                            const wfEntry = wf.find(s => s.step === step);
                            const statusDate = parseStatusDate(j.Status);
                            const statusUser = parseStatusUser(j.Status);
                            const progressPct = wf.length > 1 ? Math.round((wf.findIndex(s => s.step === step) / (wf.length - 1)) * 100) : 0;
                            return (
                              <tr key={i} style={{ borderBottom: "1px solid #f1f5f9", background: i % 2 === 0 ? "white" : "#fafafa" }}>
                                <td style={{ padding: "9px 14px" }}>
                                  <div style={{ fontWeight: 500 }}>{j.Name}</div>
                                  <div style={{ fontSize: 11, color: "#94a3b8" }}>{j.Client}</div>
                                </td>
                                <td style={{ padding: "9px 14px", color: "#475569", fontSize: 12 }}>{formatDate(j["P/E Date"])}</td>
                                <td style={{ padding: "9px 14px", fontSize: 12 }}>
                                  <span style={{ color: dc === "overdue" ? "#dc2626" : dc === "urgent" ? "#f97316" : "#475569", fontWeight: dc === "overdue" || dc === "urgent" ? 600 : 400 }}>
                                    {formatDate(j["Stat. D/Line"])}
                                    {days !== null && <span style={{ marginLeft: 6, fontSize: 11 }}>
                                      {days < 0 ? `(${Math.abs(days)}d over)` : `(${days}d)`}
                                    </span>}
                                  </span>
                                </td>
                                <td style={{ padding: "9px 14px", color: "#475569", fontSize: 12 }}>{j["Job Partner"] || "—"}</td>
                                <td style={{ padding: "9px 14px" }}>
                                  <div style={{ fontSize: 12, color: wfEntry?.complete ? "#059669" : "#475569", fontWeight: wfEntry?.complete ? 600 : 400 }}>
                                    {wfEntry?.label || "Pending"}
                                  </div>
                                  {statusDate && <div style={{ fontSize: 11, color: "#94a3b8" }}>{statusDate} {statusUser}</div>}
                                  <div style={{ background: "#f1f5f9", borderRadius: 2, height: 3, marginTop: 4, width: 80 }}>
                                    <div style={{ background: wfEntry?.complete ? "#059669" : color, height: 3, borderRadius: 2, width: progressPct + "%" }} />
                                  </div>
                                </td>
                                <td style={{ padding: "6px 10px", minWidth: 130 }}>
                                  {(() => {
                                    const key = noteKey(j);
                                    const isEditingA = editingAlloc === key;
                                    const existing = allocations[key] || "";
                                    if (isEditingA) return (
                                      <input autoFocus value={editingAllocVal}
                                        onChange={e => setEditingAllocVal(e.target.value)}
                                        onBlur={() => { saveAlloc(key, editingAllocVal); setEditingAlloc(null); }}
                                        onKeyDown={e => { if (e.key === "Enter" || e.key === "Escape") { if (e.key === "Enter") saveAlloc(key, editingAllocVal); setEditingAlloc(null); } }}
                                        style={{ width: "100%", fontSize: 12, border: "1px solid #2563eb", borderRadius: 5, padding: "4px 8px", outline: "none", fontFamily: "inherit" }}
                                      />
                                    );
                                    return (
                                      <div onClick={() => { setEditingAlloc(key); setEditingAllocVal(existing); }}
                                        style={{ minHeight: 26, cursor: "text", fontSize: 12, padding: "3px 6px", borderRadius: 5, border: "1px solid transparent", transition: "border 0.1s",
                                          color: existing ? "#1e293b" : "#cbd5e1", fontStyle: existing ? "normal" : "italic" }}
                                        onMouseEnter={e => e.currentTarget.style.borderColor = "#e2e8f0"}
                                        onMouseLeave={e => e.currentTarget.style.borderColor = "transparent"}>
                                        {existing || "Assign…"}
                                        {existing && <span onClick={e => { e.stopPropagation(); saveAlloc(key, ""); }} style={{ marginLeft: 6, color: "#94a3b8", fontSize: 11, cursor: "pointer" }}>✕</span>}
                                      </div>
                                    );
                                  })()}
                                </td>
                                <td style={{ padding: "6px 10px", minWidth: 150 }}>
                                  {(() => {
                                    const nk = noteKey(j);
                                    const isEditingN = editingNote === nk;
                                    const existingN = notes[nk] || "";
                                    if (isEditingN) return (
                                      <textarea autoFocus value={editingVal}
                                        onChange={e => setEditingVal(e.target.value)}
                                        onBlur={() => { saveNote(nk, editingVal); setEditingNote(null); }}
                                        onKeyDown={e => { if (e.key === "Escape") setEditingNote(null); if (e.key === "Enter" && !e.shiftKey) { saveNote(nk, editingVal); setEditingNote(null); e.preventDefault(); } }}
                                        style={{ width: "100%", fontSize: 12, border: "1px solid #2563eb", borderRadius: 5, padding: "4px 8px", outline: "none", fontFamily: "inherit", minHeight: 54, resize: "vertical" }}
                                      />
                                    );
                                    return (
                                      <div onClick={() => { setEditingNote(nk); setEditingVal(existingN); }}
                                        style={{ minHeight: 26, cursor: "text", fontSize: 12, padding: "3px 6px", borderRadius: 5, border: "1px solid transparent", transition: "border 0.1s",
                                          color: existingN ? "#1e293b" : "#cbd5e1", fontStyle: existingN ? "normal" : "italic", whiteSpace: "pre-wrap", maxWidth: 200 }}
                                        onMouseEnter={e => e.currentTarget.style.borderColor = "#e2e8f0"}
                                        onMouseLeave={e => e.currentTarget.style.borderColor = "transparent"}>
                                        {existingN || "Add note…"}
                                        {existingN && <span onClick={e => { e.stopPropagation(); saveNote(nk, ""); }} style={{ marginLeft: 6, color: "#94a3b8", fontSize: 11, cursor: "pointer" }}>✕</span>}
                                      </div>
                                    );
                                  })()}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              );
            })()}
          </div>
        )}

        {/* HOW TO USE */}
        {activeTab === "help" && (
          <div style={{ maxWidth: 800 }}>

            {/* Getting started */}
            <div style={{ background: "white", border: "1px solid #e2e8f0", borderRadius: 10, padding: 24, marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
                <div style={{ background: "#eff6ff", borderRadius: 8, padding: "8px 10px", fontSize: 20 }}>🚀</div>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 15, color: "#1e293b" }}>Getting Started</div>
                  <div style={{ fontSize: 12, color: "#64748b" }}>Setting up the app for your team</div>
                </div>
              </div>
              {[
                ["1", "Upload to Teams", "Go to your Teams channel → Files tab → Upload → select fs_practice_manager.html. Do this once — this becomes the master copy everyone downloads from."],
                ["2", "Each team member downloads it", "In the Files tab, click the file → ⋯ (three dots) → Download. Open the downloaded file in Chrome or Edge. Do not try to open it directly from Teams — it must be downloaded first."],
                ["3", "Import your IRIS data", "Click ↑ Import CSV in the top right and select your latest export from IRIS. This only needs doing on your own machine — others import their own copy when needed."],
              ].map(([num, title, desc]) => (
                <div key={num} style={{ display: "flex", gap: 14, marginBottom: 14, paddingBottom: 14, borderBottom: "1px solid #f1f5f9" }}>
                  <div style={{ background: "#2563eb", color: "white", borderRadius: "50%", width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, flexShrink: 0, marginTop: 2 }}>{num}</div>
                  <div>
                    <div style={{ fontWeight: 600, fontSize: 13, color: "#1e293b", marginBottom: 3 }}>{title}</div>
                    <div style={{ fontSize: 13, color: "#475569", lineHeight: 1.6 }}>{desc}</div>
                  </div>
                </div>
              ))}
            </div>

            {/* Updating IRIS data */}
            <div style={{ background: "white", border: "1px solid #e2e8f0", borderRadius: 10, padding: 24, marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
                <div style={{ background: "#f0fdf4", borderRadius: 8, padding: "8px 10px", fontSize: 20 }}>📥</div>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 15, color: "#1e293b" }}>Refreshing Job Data from IRIS</div>
                  <div style={{ fontSize: 12, color: "#64748b" }}>Do this weekly or whenever you need up-to-date stages</div>
                </div>
              </div>
              {[
                ["1", "Export from IRIS", "Run your usual job export from IRIS and save the CSV file."],
                ["2", "Import into the app", "Click ↑ Import CSV (top right of this app). Select the CSV — the job data updates instantly. Your notes and allocations are unaffected."],
                ["3", "Your data persists", "The app remembers the last CSV you imported — reloading the page will not lose it. The import date shown next to the job count confirms which export is loaded."],
              ].map(([num, title, desc]) => (
                <div key={num} style={{ display: "flex", gap: 14, marginBottom: 14, paddingBottom: 14, borderBottom: "1px solid #f1f5f9" }}>
                  <div style={{ background: "#059669", color: "white", borderRadius: "50%", width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, flexShrink: 0, marginTop: 2 }}>{num}</div>
                  <div>
                    <div style={{ fontWeight: 600, fontSize: 13, color: "#1e293b", marginBottom: 3 }}>{title}</div>
                    <div style={{ fontSize: 13, color: "#475569", lineHeight: 1.6 }}>{desc}</div>
                  </div>
                </div>
              ))}
            </div>

            {/* Sharing notes */}
            <div style={{ background: "white", border: "1px solid #e2e8f0", borderRadius: 10, padding: 24, marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
                <div style={{ background: "#faf5ff", borderRadius: 8, padding: "8px 10px", fontSize: 20 }}>📝</div>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 15, color: "#1e293b" }}>Sharing Notes & Allocations with the Team</div>
                  <div style={{ fontSize: 12, color: "#64748b" }}>Notes save on your device — use this workflow to keep everyone in sync</div>
                </div>
              </div>
              {[
                ["1", "Add your notes", "In the All Jobs tab, click any cell in the Notes column to add an action for admin. In By Job Type, use the Allocated To column to assign jobs to team members."],
                ["2", "Export your notes", "Click ↓ Notes (top right). This downloads a CSV called fs_notes_[date].csv containing all your notes and allocations."],
                ["3", "Upload to Teams", "Go to your Teams channel Files tab. Upload the CSV — name it fs_notes_latest.csv so it's easy to find. Replace the old one each time."],
                ["4", "Team members import it", "Others click ↑ Notes in the app and select the CSV downloaded from Teams. Their notes merge with yours — nothing gets overwritten."],
              ].map(([num, title, desc]) => (
                <div key={num} style={{ display: "flex", gap: 14, marginBottom: 14, paddingBottom: 14, borderBottom: "1px solid #f1f5f9" }}>
                  <div style={{ background: "#7c3aed", color: "white", borderRadius: "50%", width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, flexShrink: 0, marginTop: 2 }}>{num}</div>
                  <div>
                    <div style={{ fontWeight: 600, fontSize: 13, color: "#1e293b", marginBottom: 3 }}>{title}</div>
                    <div style={{ fontSize: 13, color: "#475569", lineHeight: 1.6 }}>{desc}</div>
                  </div>
                </div>
              ))}
            </div>

            {/* Quick reference */}
            <div style={{ background: "#f8fafc", border: "1px solid #e2e8f0", borderRadius: 10, padding: 20 }}>
              <div style={{ fontWeight: 700, fontSize: 13, color: "#475569", marginBottom: 12, textTransform: "uppercase", letterSpacing: "0.5px" }}>Quick Reference — Header Buttons</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                {[
                  ["↑ Import CSV", "#2563eb", "Load a fresh IRIS export. Updates job data only — notes are unaffected."],
                  ["↓ Notes (n)", "#0f766e", "Export all notes and allocations as a CSV to share with the team."],
                  ["↑ Notes", "#334155", "Import a notes CSV from a colleague. Merges with your existing notes."],
                  ["⚠ built-in data", "#f97316", "Warning shown when no IRIS CSV has been imported yet. Import one to clear it."],
                ].map(([btn, color, desc]) => (
                  <div key={btn} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                    <div style={{ background: color, color: "white", padding: "3px 10px", borderRadius: 5, fontSize: 11, fontWeight: 600, whiteSpace: "nowrap", flexShrink: 0 }}>{btn}</div>
                    <div style={{ fontSize: 12, color: "#64748b", lineHeight: 1.5 }}>{desc}</div>
                  </div>
                ))}
              </div>
            </div>

          </div>
        )}

      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

  </script>
